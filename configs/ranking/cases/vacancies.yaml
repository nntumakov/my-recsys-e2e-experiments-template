# Scores are illustrative inputs, not measured BM25 or model predictions.
# Judgments (0–3) are independent of both ranking signals.
- _target_: src.experiments.testing.compare.ComparisonCase
  key: warehouse
  data:
    _target_: src.core.transformers.data.PipelineData
    filters:
      - _target_: src.domain.request.filters.QueryFilter
        text: комплектовщик без опыта 2/2
    items:
      _target_: src.domain.collection.serp.SERP
      items:
        - _target_: src.domain.document.vacancy.Vacancy
          id: warehouse-night
          fields: {title: Комплектовщик ночной смены, description: Сборка заказов с ТСД. Нужен опыт от года., city: Москва, schedule: night, text_match: 9.0, preference_match: 0.2}
        - _target_: src.domain.document.vacancy.Vacancy
          id: warehouse-trainee
          fields: {title: Сборщик заказов, description: Обучение работе с ТСД. Опыт не требуется., city: Москва, schedule: 2/2, text_match: 8.0, preference_match: 0.9}
        - _target_: src.domain.document.vacancy.Vacancy
          id: warehouse-experienced
          fields: {title: Комплектовщик, description: Сборка заказов. Требуется опыт от года., city: Москва, schedule: 2/2, text_match: 7.0, preference_match: 0.6}
        - _target_: src.domain.document.vacancy.Vacancy
