write_consistency: 1

integration:
  _target_: src.integrations.qdrant.client.QdrantIntegration
  url: ${qdrant.url}
  api_key: ${qdrant.api_key}
  version: ${qdrant.version}
  timeout: ${qdrant.timeout}
  operation_timeout: ${qdrant.operation_timeout}
  verification_deadline: ${qdrant.verification_deadline}
  response_bytes: ${qdrant.response_bytes}
  payload_bytes: ${qdrant.payload_bytes}
  upload_batch_bytes: ${qdrant.upload_batch_bytes}
  shards: ${qdrant.shards}
  replicas: ${qdrant.replicas}
  write_consistency: ${qdrant.write_consistency}

source:
  _target_: src.integrations.qdrant.source.QdrantSource
  profile: ${embedding.profile}
  recipe: ${corpus.text}
  corpus_identity: ${corpus.identity}
  filter_fields: ${qdrant.filter_fields}
  vector: ${qdrant.vector}
  runtime:
    version: ${embedding.runtime.version}
    image: ${embedding.runtime.image}
