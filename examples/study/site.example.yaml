# Copy this file to a site-owned path and fill the declared source values.
# Load using configs/ as Hydra search path; see the study notebook and README.
defaults:
  - study
  - _self_

connection:
  url: null
study:
  registered: [f1, f2, f3, f4, f5, e1, e2, e3, e4, e5]
  fulltext_description_field: description
  fulltext_source:
    index: null
    fields: [title, description]
    title_field: title
  filters:
    city: {type: keyword, opensearch_field: city.keyword, opensearch_source_path: [city], qdrant_path: [city]}
    active: {type: boolean, opensearch_field: active, opensearch_source_path: [active], qdrant_path: [active]}
  collections:
    whole: null
    title: null
    body: null
    chunk: null
  comparability: {comparable: false}
corpus:
  path: null
  identity: study-cohort-v1
embedding:
  runtime:
    image: null
    gpu_uuid: null
    cache_dir: null
qdrant:
  url: null
